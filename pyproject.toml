[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "data_retriever"
version = "1.15"
dependencies = [
    "pandas~=2.2.2",
    "enums~=0.0.2",
    "ujson~=5.10.0",
    "numpy~=2.0.1",
    "inflection~=0.5.1",
    "beautifulsoup4~=4.12.3",
    "requests~=2.32.3",
    "python-dateutil~=2.9.0.post0",
    "jsonlines~=4.0.0",
    "urllib3~=2.2.2",
    "pymongo~=4.8.0",
    "filesplit~=4.1.0",
    "python-dotenv~=1.0.1",
    "openpyxl",
]
authors = [
  { name="Nelly Barret", email="nelly.barret@polimi.it" },
  { name="Carlo Bono", email="carlo.bono@polimi.it" }
]
description = "The package to retrieve data from ETL-built databases. Part of the BETTER project."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://www.better-health-project.eu/"
Issues = "https://git.rwth-aachen.de/padme-development/external/better/data-cataloging/etl/-/issues"